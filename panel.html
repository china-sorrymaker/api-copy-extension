<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="json-tree.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon" aria-hidden="true">{ }</span><strong>API Copy</strong><span class="muted tagline">接口调试，轻松复制</span></div>
    <details id="settingsMenu" class="settings-menu">
      <summary title="脱敏设置" aria-label="打开或收起脱敏设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.3-1.6.9L5 5.6 2.5 10l1.7 1.7v1.8L2.5 15 5 19.4l2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.5-4.4-1.7-1.5v-1.8l1.7-1.7L19 5.6l-2.3.6-1.6-.9L14.5 3z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
      </summary>
      <section class="settings-popover" aria-labelledby="settingsTitle">
        <div class="settings-heading"><div><h2 id="settingsTitle">脱敏设置</h2><p class="muted">自动保存，仅影响复制结果</p></div><button id="closeSettings" class="icon-button" aria-label="关闭脱敏设置" title="关闭">×</button></div>
        <div class="mask-settings">
          <div class="mask-numbers">
            <label>首部保留<input id="maskPrefix" type="number" min="0" max="12" value="4"></label>
            <label>尾部保留<input id="maskSuffix" type="number" min="0" max="12" value="4"></label>
            <label>星号数量<input id="maskCount" type="number" min="1" max="32" value="8"></label>
          </div>
          <label class="masked-headers">不允许明文的请求头<input id="maskedHeaders" type="text" placeholder="例如 company-ticket, login-sign" spellcheck="false" autocomplete="off"></label>
          <p class="mask-help">Auth、Token、Cookie 等自动脱敏。其他需要脱敏的头填在上方，用逗号分隔，忽略大小写。普通业务头默认明文。</p>
          <div class="mask-preview"><span>脱敏效果</span><code id="maskPreview"></code></div>
        </div>
      </section>
    </details>
  </header>
  <div class="toolbar">
    <div class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="filter" type="search" placeholder="搜索 URL、请求方法或状态码" aria-label="筛选请求"></div>
    <label class="failed-filter"><input id="failedOnly" type="checkbox">仅异常</label>
    <button id="clear" class="quiet-button">清空列表</button>
  </div>
  <main class="layout">
    <section class="list" aria-label="请求列表"><div class="list-heading"><span>请求记录</span><span id="count" class="muted">等待网络请求…</span></div><div id="requests"></div></section>
    <div id="splitter" class="splitter" role="separator" aria-label="拖动以调整请求列表和内容区宽度" aria-orientation="vertical" tabindex="0" title="拖动调整宽度；双击恢复默认"></div>
    <section class="detail" aria-label="请求详情">
      <div id="placeholder"><div class="empty-icon" aria-hidden="true">{ }</div><strong>选择一个请求</strong><p>在左侧查看接口，复制你需要的调试信息。<br>还没有请求？刷新正在调试的页面试试。</p></div>
      <div id="selected" hidden>
        <div class="request-overview">
          <div class="headline"><b id="method" class="method-pill"></b><code id="url"></code><span id="status" class="status-pill"></span><span id="timing" class="muted"></span></div>
          <div class="buttons"><button class="primary" id="copyAll">完整复制</button><button id="copyCompact">精简复制</button><span class="button-divider" aria-hidden="true"></span><button id="copyUrl" title="复制包含协议、域名及参数的完整 URL">复制 URL</button><button id="copyUri" title="复制路径及查询参数，不包含协议和域名">复制 URI</button><button id="copyInput">复制入参</button><button id="copyOutput">复制返回值</button></div>
        </div>
        <section class="content-card"><div class="section-heading"><h2>请求参数</h2><span class="muted">Query / Body</span></div><pre id="input"></pre></section>
        <section class="content-card"><div class="section-heading response-heading"><h2>响应内容</h2><div class="output-bar"><button id="expandJson">全部展开</button><button id="collapseJson">全部折叠</button><button id="retryResponse">重试读取响应</button></div></div><div id="outputTree" class="json-tree" hidden></div><pre id="output"></pre></section>
      </div>
    </section>
  </main>
  <div id="feedback" role="status" aria-live="polite"></div>
  <script src="format.js"></script>
  <script src="json-tree.js"></script>
  <script src="panel.js"></script>
</body>
</html>
